# Repository configuration for docs assembly
# Format: slug|github_repo|section_title[|subdir]
#
# Convention per source repo:
#   OVERVIEW.md        at repo root (or subdir)  →  becomes the section intro
#   public-docs/*.md   at repo root (or subdir)  →  become the section pages
#
# The optional 4th column (subdir) is a path prefix within the repo, e.g. "rubot"
# for a sub-project that lives at rubot/OVERVIEW.md and rubot/public-docs/.
#
# Adding a new repo: append a line here, push, done.

edgepress|rubrion/edgepress|EdgePress
specfit|rubrion/specfit|SpecFit
store|rubrion/store|Rubrion Store
rubot|rubrion/rubot|Rubot
